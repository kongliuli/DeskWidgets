<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather</title><link rel="stylesheet" href="https://assets.widgets.local/base.css"><link rel="stylesheet" href="style.css"></head><body><main class="widget weather"><div class="content"><header><button id="city" title="切换城市">南京 <span>⌄</span></button><span id="condition" class="caption">正在获取天气</span></header><div class="temperature"><strong id="temperature">--</strong><span>°C</span></div><div class="range caption" id="range">等待在线数据</div><div class="details"><div><small>体感</small><span id="feels">--</span></div><div><small>湿度</small><span id="humidity">--</span></div><div><small>风速</small><span id="wind">--</span></div></div><footer><button id="refresh" title="刷新天气">刷新</button><span id="status" role="status">连接中…</span><span class="credit">Open-Meteo · CC BY 4.0</span></footer></div><dialog id="city-dialog"><h2>选择城市</h2><form id="city-search"><label>城市名称<input name="query" placeholder="南京 / Shanghai / New York" required minlength="2" maxlength="80" autocomplete="off"></label><div class="actions"><button type="button" id="cancel-city">取消</button><button type="submit">搜索</button></div></form><p id="search-status" role="status"></p><div id="city-results"></div></dialog></main><script type="module" src="app.js"></script></body></html>
