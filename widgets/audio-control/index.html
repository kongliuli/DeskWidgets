<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Control</title><link rel="stylesheet" href="https://assets.widgets.local/base.css"><link rel="stylesheet" href="style.css"></head><body><main class="widget audio"><div class="content"><header><strong>音量与电平</strong><span id="muted-state"></span></header><div class="volume-readout"><span id="volume">--</span><small>%</small><span class="endpoint">默认多媒体输出</span></div><div class="functional-controls volume-controls"><input id="volume-slider" type="range" min="0" max="100" step="1" value="0" aria-label="系统主音量" disabled><button id="mute" disabled>静音</button></div><section id="meter-panel"><div class="meter-label"><span>音量前信号峰值</span><strong id="decibels">-- dBFS</strong></div><div class="meter-track" role="meter" aria-label="输出信号峰值" aria-valuemin="-80" aria-valuemax="0" id="level-meter"><div id="level"></div></div></section><footer id="audio-status" role="status">等待宿主音频服务</footer></div></main><script type="module" src="app.js"></script></body></html>
