<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>剪贴板缓存</title><link rel="stylesheet" href="https://assets.widgets.local/base.css"><link rel="stylesheet" href="style.css"></head><body><main class="widget"><div class="content"><header>剪贴板 <span id="count">0</span><span id="visible-count">条 · 可见 0 条</span></header><div id="recent" class="entries" aria-label="点选复制最近内容"></div><p id="empty">复制文字或图片后会出现在这里，点击条目即可复制。</p><div class="controls functional-controls"><button id="pause">暂停缓存</button><button id="history-open">历史与搜索</button><button id="clear">清空缓存</button></div><p id="status" role="status">文本与图片 · 本次运行内保留</p></div><dialog id="history"><header>缓存历史 <button id="history-close">关闭</button></header><input id="search" type="search" placeholder="搜索完整内容" aria-label="搜索历史"><div id="results" class="entries"></div></dialog></main><script type="module" src="app.js"></script></body></html>
