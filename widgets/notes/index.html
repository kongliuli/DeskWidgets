<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻量便签</title><link rel="stylesheet" href="https://assets.widgets.local/base.css"><link rel="stylesheet" href="https://assets.widgets.local/utility.css"><link rel="stylesheet" href="style.css"></head><body><main class="widget"><div class="content"><header>随手记</header><textarea id="note" aria-label="便签内容" maxlength="50000" placeholder="写下此刻要记住的事…"></textarea><div class="row functional-controls note-actions"><button id="save-history">保存到历史</button><button id="open-history">历史便签 <span id="history-count">0</span></button></div><p class="status" id="status">本实例自动保存 · 纯文本</p></div><dialog id="history" class="editor"><header class="row"><strong>历史便签</strong><button id="close-history">关闭</button></header><div id="history-list" class="list"></div><textarea id="history-text" aria-label="历史便签全文" readonly hidden></textarea><p id="history-status" class="status">拖出便签后会固定在桌面底层，点击穿透。在这里关闭。</p></dialog></main><script type="module" src="app.js"></script></body></html>
