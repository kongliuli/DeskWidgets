<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Monitor</title><link rel="stylesheet" href="https://assets.widgets.local/base.css"><link rel="stylesheet" href="style.css"></head><body><main class="widget monitor"><div class="content"><header><strong>系统资源</strong><span id="sampling-state">等待宿主</span></header><nav id="layouts" class="functional-controls layouts" aria-label="图表布局"><button data-layout="bars">进度条</button><button data-layout="radar">雷达</button><button data-layout="rings">环形图</button><button data-layout="lines">折线</button></nav><div class="plot"><div id="bars"></div><canvas id="chart" role="img" aria-label="系统资源图表"></canvas><p id="empty" hidden>未启用指标</p></div><section id="dashboard" hidden aria-label="四图总览"><article><h2>进度条</h2><div id="dashboard-bars"></div></article><article><h2>雷达图</h2><canvas id="radar-chart" role="img"></canvas><p id="radar-hint" hidden>启用全部三项指标以显示雷达图</p></article><article><h2>独立环形图</h2><canvas id="rings-chart" role="img"></canvas></article><article><h2>两分钟折线图</h2><canvas id="lines-chart" role="img"></canvas></article></section><div id="legend" class="legend"></div><footer><span id="detail">每 2 秒采样</span><button id="pause" class="functional-controls" title="暂停或恢复采样">暂停</button></footer></div></main><script type="module" src="app.js"></script></body></html>
